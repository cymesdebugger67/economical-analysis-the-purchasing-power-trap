[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "purchasing-power-trap"
version = "0.1.0"
description = "Descriptive analysis of statutory wages and prices in Davao Region"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5,<3", "matplotlib>=3.7,<4", "requests>=2.28,<3"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
notebook = ["jupyter>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
